syntax = "proto3";

package shop;

message Item {
  string name = 1;
  int32 qty = 2;
  int32 price_cents = 3;
}

message Order {
  int32 id = 1;
  string customer = 2;
  repeated Item items = 3;
  int32 total_cents = 4;
}

message GetOrderRequest {
  int32 id = 1;
  int32 item_count = 2;
}

service Orders {
  rpc GetOrder(GetOrderRequest) returns (Order);
}
