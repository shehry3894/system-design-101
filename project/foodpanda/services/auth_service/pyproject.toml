[project]
name = "auth-service"
version = "1.0.0"
description = "Authentication and Authorization Service"
readme = "README.md"
requires-python = ">=3.12"

# uv sync --frozen --no-dev, installs only [project].dependencies
dependencies = [
    "fastapi[all]",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",  # SQLAlchemy 2.1+ uses psycopg 3 for postgresql:// URLs
    "passlib[bcrypt]",
    "bcrypt<5",  # passlib 1.7.4 crashes on bcrypt 5; drop when we move to pwdlib
    "python-jose[cryptography]",
    "pydantic-settings"
]

# uv sync --frozen --dev, installs both dependencies + dev-dependencies
[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-dotenv",
    "pytest-asyncio",
    "httpx",
]
